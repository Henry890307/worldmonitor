<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K歌猜歌王</title><style>
:root{--bg:#0f1020;--panel:#17192d;--line:#30334f;--text:#f7f7fb;--muted:#a9adc5;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#26233f,#0f1020 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}.wrap{width:min(980px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:25px}.small,.note{font-size:13px;color:var(--muted)}.card{background:rgba(23,25,45,.96);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.25)}.hero{margin-top:7vh;max-width:680px;margin-left:auto;margin-right:auto}h1{font-size:clamp(38px,8vw,68px);line-height:1.02;margin:10px 0 12px}input,button{font:inherit}input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:#0f1122;color:white}button{padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:#242741;color:white;font-weight:800;cursor:pointer}button.primary{background:var(--purple);border-color:var(--purple)}.row{display:flex;gap:10px;flex-wrap:wrap}.join{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:20px}.hidden{display:none!important}.badge{display:inline-block;background:#2c2950;color:#ddd6fe;border-radius:999px;padding:6px 10px;font-size:13px}.status{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.option{text-align:left;min-height:68px;background:#20233c}.option.sel{outline:2px solid var(--purple);background:#2b2850}.timer{height:10px;background:#0f1122;border-radius:99px;overflow:hidden;margin:16px 0 24px}.timer>div{height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);width:100%}.center{text-align:center}.big{font-size:44px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{display:inline-block;background:#153520;color:#bbf7d0;border:1px solid #245f35;border-radius:999px;padding:8px 11px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats div,.adminq,.rank{background:#101225;border-radius:14px;padding:14px}.stats b{display:block;font-size:24px}.leader{display:grid;gap:8px;margin-top:14px}.rank{display:grid;grid-template-columns:42px 1fr auto;gap:8px}@media(max-width:720px){.grid,.options,.join{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">K歌猜歌王</div><div class="small">台灣 KTV 猜歌破冰遊戲</div></div><button id="adminBtn">主持人</button></div>
<section id="home" class="card hero"><div class="badge">活動版</div><h1>聽歌，搶答，拚排名</h1><p class="note">輸入暱稱後直接加入。主持人 PIN 0926。</p><div class="join"><input id="name" maxlength="20" placeholder="輸入你的暱稱"><button id="join" class="primary">加入遊戲</button></div></section>
<section id="player" class="hidden"><div class="status"><span id="who"></span><span>分數 <b id="score">0</b></span></div><div id="lobby" class="card center"><div class="big">♪</div><h2>已加入</h2><p class="note">等主持人開始。</p></div><div id="quiz" class="card hidden"><div class="row" style="justify-content:space-between"><span id="cat" class="badge"></span><span>第 <b id="num"></b> 題</span></div><div class="timer"><div id="bar"></div></div><h2>這首歌叫什麼？</h2><div id="opts" class="options"></div><p id="locked" class="note"></p></div><div id="reveal" class="card center hidden"><div class="badge">正確答案</div><h2 id="song" class="big"></h2><p id="artist"></p><div id="result" class="adminq"></div></div><div id="board" class="card hidden"><div class="badge">排行榜</div><h2>目前名次</h2><div id="leader" class="leader"></div></div></section>
<section id="admin" class="hidden"><div class="grid"><div class="card"><div class="badge">主持人控制台</div><h2>主持人模式</h2><div class="stats"><div><b id="aq">1</b><span>題號</span></div><div><b id="ascore">0</b><span>本機分數</span></div><div><b>26</b><span>題庫</span></div></div><div class="row"><button id="start" class="primary">開始目前題</button><button id="showans">公布答案</button><button id="next" class="primary">下一題</button><button id="prev">上一題</button><button id="showboard">排行榜</button><button id="backlobby">回等候室</button></div></div><div class="card"><div class="badge">現在</div><div class="adminq"><h2 id="cs"></h2><p id="ca"></p><div id="cans" class="answer"></div><p id="ch" class="note"></p></div></div><div class="card"><div class="badge">下一題</div><div class="adminq"><h2 id="ns"></h2><p id="na"></p><div id="nans" class="answer"></div></div></div><div class="card"><div class="badge">下下題</div><div class="adminq"><h2 id="n2s"></h2><p id="n2a"></p><div id="n2ans" class="answer"></div></div></div></div></section>
<section id="login" class="card hidden" style="max-width:420px;margin:8vh auto"><div class="badge">主持人登入</div><h2>輸入 PIN</h2><input id="pin" inputmode="numeric" placeholder="0926"><div class="row" style="margin-top:12px"><button id="cancel">取消</button><button id="loginBtn" class="primary">登入</button></div><p id="err" style="color:#fca5a5"></p></section></div>
<script>const Q=[{"category":"全民KTV","song":"童話","artist":"光良","options":["童話","第一次","約定","勇氣"],"answer":"童話","hint":"播前奏或第一句"},{"category":"全民KTV","song":"勇氣","artist":"梁靜茹","options":["勇氣","暖暖","可惜不是你","分手快樂"],"answer":"勇氣","hint":"播副歌前"},{"category":"全民KTV","song":"小情歌","artist":"蘇打綠","options":["小情歌","無與倫比的美麗","我好想你","他夏了夏天"],"answer":"小情歌","hint":"播前奏"},{"category":"全民KTV","song":"隱形的翅膀","artist":"張韶涵","options":["隱形的翅膀","遺失的美好","歐若拉","淋雨一直走"],"answer":"隱形的翅膀","hint":"播前奏"},{"category":"全民KTV","song":"愛你","artist":"王心凌","options":["愛你","睫毛彎彎","Honey","第一次愛的人"],"answer":"愛你","hint":"播前奏"},{"category":"全民KTV","song":"痴心絕對","artist":"李聖傑","options":["痴心絕對","手放開","最近","你那麼愛她"],"answer":"痴心絕對","hint":"播前奏"},{"category":"全民KTV","song":"我懷念的","artist":"孫燕姿","options":["我懷念的","遇見","開始懂了","天黑黑"],"answer":"我懷念的","hint":"播主歌"},{"category":"周杰倫","song":"七里香","artist":"周杰倫","options":["七里香","晴天","夜曲","擱淺"],"answer":"七里香","hint":"播前奏 5 到 7 秒"},{"category":"周杰倫","song":"擱淺","artist":"周杰倫","options":["擱淺","安靜","黑色毛衣","退後"],"answer":"擱淺","hint":"播主歌"},{"category":"周杰倫","song":"說好的幸福呢","artist":"周杰倫","options":["說好的幸福呢","最長的電影","蒲公英的約定","不能說的秘密"],"answer":"說好的幸福呢","hint":"播前奏"},{"category":"周杰倫","song":"告白氣球","artist":"周杰倫","options":["告白氣球","甜甜的","簡單愛","陽光宅男"],"answer":"告白氣球","hint":"播前奏"},{"category":"周杰倫","song":"晴天","artist":"周杰倫","options":["晴天","回到過去","楓","軌跡"],"answer":"晴天","hint":"播吉他前奏"},{"category":"千禧經典","song":"倒帶","artist":"蔡依林","options":["倒帶","天空","說愛你","檸檬草的味道"],"answer":"倒帶","hint":"播前奏"},{"category":"千禧經典","song":"江南","artist":"林俊傑","options":["江南","曹操","一千年以後","修煉愛情"],"answer":"江南","hint":"播前奏"},{"category":"千禧經典","song":"小酒窩","artist":"林俊傑、蔡卓妍","options":["小酒窩","豆漿油條","當你","背對背擁抱"],"answer":"小酒窩","hint":"播副歌前"},{"category":"千禧經典","song":"聽海","artist":"張惠妹","options":["聽海","原來你什麼都不要","剪愛","記得"],"answer":"聽海","hint":"播主歌"},{"category":"千禧經典","song":"Last Dance","artist":"伍佰","options":["Last Dance","挪威的森林","突然的自我","浪人情歌"],"answer":"Last Dance","hint":"播前奏"},{"category":"千禧經典","song":"淚橋","artist":"伍佰","options":["淚橋","白鴿","愛你一萬年","樹枝孤鳥"],"answer":"淚橋","hint":"播前奏"},{"category":"千禧經典","song":"雨愛","artist":"楊丞琳","options":["雨愛","曖昧","帶我走","年輪說"],"answer":"雨愛","hint":"播副歌前"},{"category":"千禧經典","song":"天后","artist":"陳勢安","options":["天后","勢在必行","非你不可","再愛一遍"],"answer":"天后","hint":"播主歌"},{"category":"台灣經典","song":"家後","artist":"江蕙","options":["家後","落雨聲","惜別的海岸","酒後的心聲"],"answer":"家後","hint":"播主歌"},{"category":"台灣經典","song":"愛拚才會贏","artist":"葉啟田","options":["愛拚才會贏","乾一杯","故鄉","浪子的心情"],"answer":"愛拚才會贏","hint":"播前奏"},{"category":"台灣經典","song":"夢醒時分","artist":"陳淑樺","options":["夢醒時分","滾滾紅塵","問","笑紅塵"],"answer":"夢醒時分","hint":"播前奏"},{"category":"KTV熱門","song":"太陽與地球","artist":"盧廣仲","options":["太陽與地球","刻在我心底的名字","幾分之幾","魚仔"],"answer":"太陽與地球","hint":"播主歌"},{"category":"KTV熱門","song":"如果可以","artist":"韋禮安","options":["如果可以","還是會","慢慢等","女孩"],"answer":"如果可以","hint":"播前奏"},{"category":"KTV熱門","song":"怎麼了","artist":"周興哲","options":["怎麼了","你，好不好？","如果雨之後","以後別做朋友"],"answer":"怎麼了","hint":"播前奏"}];let idx=0,score=0,choice=null,timer=null,playerName=localStorage.getItem("ksong_name")||"";const $=s=>document.querySelector(s);$("#name").value=playerName;function hideAll(){["#home","#player","#admin","#login"].forEach(x=>$(x).classList.add("hidden"))}function pp(id){["#lobby","#quiz","#reveal","#board"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
$("#join").onclick=()=>{playerName=$("#name").value.trim();if(!playerName)return;localStorage.setItem("ksong_name",playerName);hideAll();$("#player").classList.remove("hidden");$("#who").textContent=playerName;$("#score").textContent=score;pp("#lobby")};$("#adminBtn").onclick=()=>{hideAll();$("#login").classList.remove("hidden")};$("#cancel").onclick=()=>{hideAll();$("#home").classList.remove("hidden")};$("#loginBtn").onclick=()=>{if($("#pin").value!=="0926"){$("#err").textContent="PIN 錯誤";return}hideAll();$("#admin").classList.remove("hidden");renderAdmin()};
function showQuestion(){const q=Q[idx];choice=null;hideAll();$("#player").classList.remove("hidden");$("#who").textContent=playerName||"玩家";$("#score").textContent=score;pp("#quiz");$("#cat").textContent=q.category;$("#num").textContent=idx+1;$("#locked").textContent="";const opts=shuffle(q.options);$("#opts").innerHTML=opts.map((o,i)=>'<button class="option" data-o="'+encodeURIComponent(o)+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("");document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(choice)return;choice=decodeURIComponent(b.dataset.o);b.classList.add("sel");document.querySelectorAll(".option").forEach(x=>x.disabled=true);$("#locked").textContent="答案已鎖定。"});runTimer()}
function runTimer(){clearInterval(timer);let left=100;$("#bar").style.width="100%";timer=setInterval(()=>{left-=1;$("#bar").style.width=left+"%";if(left<=0){clearInterval(timer);document.querySelectorAll(".option").forEach(x=>x.disabled=true)}},100)}
function revealAnswer(){const q=Q[idx];clearInterval(timer);const correct=choice===q.answer;if(correct)score+=1000;hideAll();$("#player").classList.remove("hidden");$("#who").textContent=playerName||"玩家";$("#score").textContent=score;pp("#reveal");$("#song").textContent=q.song;$("#artist").textContent=q.artist;$("#result").textContent=choice?(correct?"答對了，+1000 分":"答錯了，你選 "+choice):"本題未作答"}
function showBoard(){hideAll();$("#player").classList.remove("hidden");$("#who").textContent=playerName||"玩家";$("#score").textContent=score;pp("#board");const rows=[{nickname:playerName||"你",score},{nickname:"多多",score:Math.max(0,score-120)},{nickname:"KIKI",score:Math.max(0,score-260)},{nickname:"馬克",score:Math.max(0,score-420)}].sort((a,b)=>b.score-a.score);$("#leader").innerHTML=rows.map((p,i)=>'<div class="rank"><b>'+(i+1)+'</b><span>'+esc(p.nickname)+'</span><strong>'+p.score+'</strong></div>').join("")}
function renderAdmin(){const q=Q[idx],n=Q[idx+1],n2=Q[idx+2];$("#aq").textContent=idx+1;$("#ascore").textContent=score;fill("c",q);fill("n",n);fill("n2",n2)}function fill(p,q){$("#"+p+"s").textContent=q?q.song:"無";$("#"+p+"a").textContent=q?q.artist:"";$("#"+p+"ans").textContent=q?"答案："+q.answer:"";if($("#"+p+"h"))$("#"+p+"h").textContent=q?q.hint:""}$("#start").onclick=showQuestion;$("#showans").onclick=revealAnswer;$("#next").onclick=()=>{idx=Math.min(Q.length-1,idx+1);renderAdmin()};$("#prev").onclick=()=>{idx=Math.max(0,idx-1);renderAdmin()};$("#showboard").onclick=showBoard;$("#backlobby").onclick=()=>{hideAll();$("#player").classList.remove("hidden");$("#who").textContent=playerName||"玩家";$("#score").textContent=score;pp("#lobby")};</script></body></html>
